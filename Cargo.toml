[workspace]
members = [".", "cli", "ffi"]
resolver = "3"

[package]
name = "pdf-strings"
version = "0.1.2"
description = "Parse structured spans of strings from PDF files"
repository = "https://github.com/bbqsrc/pdf-strings"
documentation = "https://docs.rs/crate/pdf-strings/"
authors = [
    "Jeff Muizelaar <jmuizelaar@mozilla.com>",
    "Brendan Molloy <brendan@bbqsrc.net>",
]
keywords = ["pdf", "text-extraction", "font", "cmap", "unicode"]
license = "MIT"
edition = "2024"

[profile.release]
debug = true

[dependencies]
adobe-cmap-parser = { path = "vendor/adobe-cmap-parser" }
encoding_rs = "0.8.35"
euclid = "0.22.14"
lopdf = {version = "0.38", default-features = false}
type1-encoding-parser = "0.1.1"
unicode-normalization = "0.1.25"
cff-parser = "0.1.0"
ttf-parser = "0.25"
tracing = "0.1.44"
fax = "0.2.6"
fontdue = "0.9.3"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
